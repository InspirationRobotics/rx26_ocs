# rx_bridge configuration. Copy per machine; do not commit course-specific edits.
#
# The addresses below are the BENCH setup: a laptop talking to the RoboNation
# stub on another machine. At the competition, `robocommand.host` becomes the
# course's .2 address and the OCS takes its own address from DHCP -- never set
# a static address on the RoboCommand-facing interface.

team_id = "ASTA"

# RETIRED -- the bridge no longer declares or sends this. The UAV geofence is per
# COURSE now (four courses, four places) and is worked out when RoboCommand's
# RxCourse arrives: a [[geofence.course]] entry at the bottom of this file if there
# is one for that course, otherwise the course boundary pulled inward by
# [geofence] boundary_margin_m. See the [geofence] section below and
# rx_bridge/geofence.py.
#
# The key is kept ONLY because the drone repo's tools/scripts/check_config.py
# (Drone/rx26_uav) still reads it, compares it with uav_params.yaml and fails
# Ekko's rebuild when it is missing. Nothing in the OCS reads it. A drone-repo change
# to drop that comparison will be proposed separately; until it lands, leave it.
#
# MUST stay above every [section] and [[array]] header -- a bare key after one
# belongs to that table, so `uav_geofence` under [tiers] parses as
# tiers.uav_geofence and is silently ignored (and check_config.py would then see
# no fence at all).
#
# A ~200 m box around RoboNation's test-course corners at Singapore (1.2803,
# 103.8557) -- larger than the ALPHA boundary, which is why it is no longer a
# declarable fence.
uav_geofence = [
    [1.28010, 103.85520],
    [1.28010, 103.85625],
    [1.28110, 103.85625],
    [1.28110, 103.85520],
    [1.28010, 103.85520],
]

# The fleet. Order here is declaration order, and the type is not decoration:
# it selects the validation policy in config._ALLOW_UNKNOWN_BY_TYPE, and the
# bridge drops any heartbeat whose own vehicle_type disagrees with it.

[[vehicle]]
id = "USV1"                 # Crusader
type = "TYPE_USV"

[[vehicle]]
id = "UUV1"                 # Graey
type = "TYPE_UUV"
relay_via = "USV1"          # submerged; Crusader carries its reports
# UNVALIDATED. Graey reaches Crusader over a 9600-baud acoustic modem, so a
# 1 s threshold would fire on essentially every frame and bury the warnings
# that matter. 10 s is a guess chosen to be quiet rather than a measurement --
# replace it once the modem has been timed on the water, and see docs/ for the
# open question to RoboNation about whether a submerged vehicle can miss the
# 2 Hz obligation at all.
stale_ms = 10000.0

[[vehicle]]
id = "UAV1"                 # Ekko
type = "TYPE_UAV"
# Ekko talks to the OCS over the RFD radio (the laptop-side fleet_link adapter,
# which says `ocs_hello link=radio`) AND may also be on team WiFi. When both are
# up the choice is made per report KIND: a kind both links deliver is taken from
# the radio and WiFi's copy dropped -- except that a kind the adapter declares it
# SYNTHESIZES (its hello's `synthesized`, e.g. ["heartbeat"]) never outranks Ekko's
# own report, whichever link that came on. A kind only one link carries (WiFi's
# task reports, IncidentAck, Readiness) is never dropped. The OCS sends everything
# down the radio -- falling back to WiFi if the radio goes quiet for [limits]
# link_prefer_s. Crusader has no preference: it only has WiFi.
prefer = "radio"
registration = "ASTA-53554"     # Chris, 7 Nov 2026: stamped by the OCS on every UAV1 heartbeat
# Both vehicle clients republish a top-level key they do not know to
# /crsd/ocs_command or /uav/ocs_command and carry on (see docs/VEHICLE_LINK.md),
# so `ocs_info` (the course, and for a UAV the declared geofence) is safe to
# send to every vehicle. Set send_info = false on any vehicle whose client is
# found to choke on it.
#
# registration = "..."      # Ekko's CAAS registration, stamped on every heartbeat
#                           # as Heartbeat.uav_registration. RoboCommand wants it only
#                           # when the team has more than one UAV registered. Blank:
#                           # the field stays blank. A heartbeat carrying a different
#                           # one is dropped as misconfigured (counter "misreg.").

[team]
# Our broker. On the bench this is the OCS itself; the vehicles publish here.
host = "127.0.0.1"
port = 1883

[tcp]
# Where the vehicles dial IN. This is the vehicle link that replaces the team
# broker: one connection per vehicle, telemetry up and commands down on the same
# socket, no broker process in between.
#
# 0.0.0.0, never 127.0.0.1 -- the OCS is dual-homed and a loopback bind is
# reachable from nothing but the laptop itself. That failure looks exactly like
# a vehicle that will not connect.
#
# The vehicle needs THIS machine's address on the team subnet. The boat finds it
# from the [discovery] beacon below (ocs_host: "auto"), so nobody types it; a
# vehicle client with a fixed address (Ekko's today) still needs this machine to
# keep one -- a static address on the team NIC or a DHCP reservation on the team
# router. (The handbook's ban on static addressing applies only to the
# RoboCommand-facing interface, not to our own team network.)
#
# 37564 is clear of the Jetson's own ports: 8090 ground_station, 8080/8081 the
# viewers it embeds.
host = "0.0.0.0"
port = 37564
enabled = true

[discovery]
# A UDP beacon that tells the vehicles where [tcp] is, so the boat's ocs_host can
# be "auto" instead of this laptop's address (which has been 192.168.100.107,
# 192.168.8.107 and 192.168.1.75). What it sends, where it never sends and what
# the boat does with it: rx_bridge/beacon.py and docs/VEHICLE_LINK.md "Discovery".
#
# Off unless enabled = true: a config without this section must not start
# broadcasting. Sent from every local address except loopback, link-local,
# anything inside never_on, and anything in the same /24 as [robocommand] host --
# the course network is never spoken on.
enabled = true
port = 37565              # UDP; paired with [tcp] port. Both sides must agree.
interval_s = 1.0          # at most 2.0: the boat forgets a beacon after 5 s
# Setting never_on REPLACES this default; keep all four course subnets in it.
never_on = ["192.168.65.0/24", "192.168.66.0/24",
            "192.168.67.0/24", "192.168.68.0/24"]   # Alpha, Bravo, Charlie, Delta

[robocommand]
# The simulated RoboNation server. See README.md for why this is on its own
# network segment and not a port on the team router.
host = "192.168.69.3"
port = 1883

[tiers]
# What we are declaring. TIER_NONE for anything not attempted this run --
# TIER_UNKNOWN is the proto3 zero value and is never legal to send.
task1 = "TIER_CORE"
task2 = "TIER_NONE"
task3 = "TIER_NONE"
task4 = "TIER_NONE"

[limits]
# Ekko alone at screening and validation, 7-8 Nov 2026. Delete this
# line for any run with Crusader, or for a Proof of Readiness log (handbook 3.1).
min_declared = 1
rate = 5.0                # messages/second, metered per vehicle -- the
                          # handbook says "per system", which settles the
                          # question the USV repo left open
heartbeat_reserve = 2.0   # tokens only heartbeats may spend
stale_ms = 1000.0         # default; per-vehicle overrides above win
link_prefer_s = 3.0       # a vehicle on two links (see `prefer` above): a report
                          # is dropped while the other link delivered the same
                          # kind within this long and outranks it (real over
                          # synthesized, then `prefer`), and a link silent
                          # longer than this stops being "fresh" when the OCS
                          # picks where to send

[paths]
seq_store = "run/seq.json"
wire_log  = "run/wire"

[uav]
# pilot_callsign: what the call-sign box next to Declare starts with. It goes out as
# RunDeclaration.uav_pilot_callsign whenever an aircraft is declared: the pilot's
# MyDroneFleets call sign for THIS run, first name + UAPL number. Per run, so it is
# typed on the page; blank here means the box starts empty and Declare stays off
# until someone types it.
pilot_callsign = ""

[geofence]
# The UAV geofence is per course. When RoboCommand's RxCourse is accepted the OCS
# declares, and tells Ekko, one of these -- "table, else the boundary":
#
#   1. a [[geofence.course]] entry below whose course_id matches -- used ONLY if
#      every vertex, and every point along every edge, is inside the course or its
#      UAV transit area (within 0.5 m). An entry that is outside is refused with
#      the vertex or edge named, and the course gets NO fence: it never silently
#      falls back to (2).
#   2. otherwise the course boundary -- joined with RxCourse.uav_transit_area when
#      the two share an edge -- shrunk inward by boundary_margin_m. Needs a simple
#      convex shape and a margin small enough not to collapse it; if not, no fence
#      and a finding on the page saying what to do (a transit area that cannot be
#      joined leaves a course-only fence, and says so).
#
# There is deliberately no entry for ALPHA: the box in `uav_geofence` above is
# larger than the ALPHA boundary, so it would be refused. ALPHA uses (2).
#
# Before every declaration with an aircraft the OCS also applies RoboCommand's own
# check (their test server's geofence_problems): at least 4 points, closed, every
# point along every edge within the course or transit area to 1 m, and a ceiling
# above 0 and at most ceiling_limit_hae_m. RoboCommand REFUSES SILENTLY -- no reply,
# the run just never starts -- so the OCS refuses first, in words, on the page.

max_altitude_hae_m = 40.0 # RunDeclaration.uav_geofence_max_altitude_hae_m: the UAV
                          # ceiling, metres above the WGS84 ellipsoid (HAE, not AMSL).
                          # PROPOSED 2026-10-31, Chase to confirm. Must cover Ekko's
                          # real ceiling, home HAE + FENCE_ALT_MAX (12 m), with room;
                          # check GPS_RAW_INT.alt_ellipsoid at home on the day.
                          # Removing the key blocks every declaration with an aircraft.
ceiling_limit_hae_m = 50.0  # The most RoboCommand accepts: their test server's
                          # MAX_UAV_ALTITUDE_HAE_M. Handbook 5.3.3 says 60 m AMSL.

boundary_margin_m = 2.0   # Chosen so the declared vertices are strictly inside the
                          # boundary, never on it, where a float-rounding validation
                          # could reject them. Chase's to change.

confirm_max_age_s = 180   # A UAV is not declared unless its autopilot was read back
                          # holding this course's fence within this many seconds
                          # (the radio adapter re-verifies every 60 s). The gate:
                          # docs/VEHICLE_LINK.md "ocs_fence".

# Example -- a hand-drawn fence for one course. Closed (first == last), every vertex
# inside that course's boundary. Uncomment and edit; course_id is as RoboCommand
# sends it. A TOML trap: keep every [[geofence.course]] BELOW this [geofence]
# header and keep top-level keys above all headers.
#
# [[geofence.course]]
# course_id = "BRAVO"
# uav_geofence = [
#     [1.28010, 103.85520],
#     [1.28010, 103.85625],
#     [1.28110, 103.85625],
#     [1.28010, 103.85520],
# ]

# Chris, 7 Nov 2026: drawn in QGC (Desktop\test.plan, polygon 1), inside SV1 by 3.5-4.6 m.
[[geofence.course]]
course_id = "SV1"
uav_geofence = [
    [1.444790255, 103.784949607],
    [1.444801231, 103.785038667],
    [1.444583736, 103.785017662],
    [1.444575146, 103.784963451],
    [1.444790255, 103.784949607],
]

# Chris, 7 Nov 2026: drawn in QGC (Desktop\sv3plan.plan, polygon 1), inside SV3.
[[geofence.course]]
course_id = "SV3"
uav_geofence = [
    [1.444685263, 103.785312892],
    [1.444750956, 103.785376074],
    [1.444618564, 103.785376074],
    [1.444593896, 103.785198898],
    [1.444685263, 103.785312892],
]
