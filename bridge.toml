# rx_bridge configuration. Copy per machine; do not commit course-specific edits.
#
# RoboCommand's broker is found by its course topic ([robocommand] host = "auto"),
# so one file works on every course network and at the Team Village demo. The
# OCS takes its own address on that network from DHCP -- never set a static
# address on the RoboCommand-facing interface.

team_id = "ASTA"

# RETIRED -- the bridge no longer declares or sends this. The UAV geofence declared
# is the one the pilot draws in QGC, read back off Ekko's autopilot; see the
# [geofence] section below and rx_bridge/geofence.py.
#
# The key is kept ONLY because the drone repo's tools/scripts/check_config.py
# (Drone/rx26_uav) still reads it, compares it with uav_params.yaml and fails
# Ekko's rebuild when it is missing. Nothing in the OCS reads it. A drone-repo change
# to drop that comparison will be proposed separately; until it lands, leave it.
#
# MUST stay above every [section] and [[array]] header -- a bare key after one
# belongs to that table, so `uav_geofence` under [tiers] parses as
# tiers.uav_geofence and is silently ignored (and check_config.py would then see
# no fence at all).
#
# A ~200 m box around RoboNation's test-course corners at Singapore (1.2803,
# 103.8557) -- larger than the ALPHA boundary, which is why it is no longer a
# declarable fence.
uav_geofence = [
    [1.28010, 103.85520],
    [1.28010, 103.85625],
    [1.28110, 103.85625],
    [1.28110, 103.85520],
    [1.28010, 103.85520],
]

# The fleet. Order here is declaration order, and the type is not decoration:
# it selects the validation policy in config._ALLOW_UNKNOWN_BY_TYPE, and the
# bridge drops any heartbeat whose own vehicle_type disagrees with it.

[[vehicle]]
id = "USV1"                 # Crusader
type = "TYPE_USV"

[[vehicle]]
id = "UUV1"                 # Graey
type = "TYPE_UUV"
prefer = "radio"             # surfaced RFD companion; WiFi remains valid pre-deployment

[[vehicle]]
id = "UAV1"                 # Ekko
type = "TYPE_UAV"
# Ekko talks to the OCS over the RFD radio (the laptop-side fleet_link adapter,
# which says `ocs_hello link=radio`) AND may also be on team WiFi. When both are
# up the choice is made per report KIND: a kind both links deliver is taken from
# the radio and WiFi's copy dropped -- except that a kind the adapter declares it
# SYNTHESIZES (its hello's `synthesized`, e.g. ["heartbeat"]) never outranks Ekko's
# own report, whichever link that came on. A kind only one link carries (WiFi's
# task reports, IncidentAck, Readiness) is never dropped. The OCS sends everything
# down the radio -- falling back to WiFi if the radio goes quiet for [limits]
# link_prefer_s. Crusader has no preference: it only has WiFi.
prefer = "radio"
registration = "ASTA-53554"     # Chris, 7 Nov 2026
# registration: the team-wide default for Ekko's CAAS registration, which the OCS
# stamps on every UAV1 heartbeat as Heartbeat.uav_registration. RoboCommand wants it
# only when the team has more than one UAV registered. It can be typed on the page
# (not during a run), and "Save as default" there keeps it on THIS laptop
# (run/operator.json), which wins over this line. Blank everywhere: the field stays
# blank. A heartbeat carrying a different one is dropped as misconfigured (counter
# "misreg.").
#
# Both vehicle clients republish a top-level key they do not know to
# /crsd/ocs_command or /uav/ocs_command and carry on (see docs/VEHICLE_LINK.md),
# so `ocs_info` (the course, and for a UAV RoboCommand's polygon) is safe to
# send to every vehicle. Set send_info = false on any vehicle whose client is
# found to choke on it.

[team]
# Our broker. On the bench this is the OCS itself; the vehicles publish here.
host = "127.0.0.1"
port = 1883

[tcp]
# Where the vehicles dial IN. This is the vehicle link that replaces the team
# broker: one connection per vehicle, telemetry up and commands down on the same
# socket, no broker process in between.
#
# 0.0.0.0, never 127.0.0.1 -- the OCS is dual-homed and a loopback bind is
# reachable from nothing but the laptop itself. That failure looks exactly like
# a vehicle that will not connect.
#
# The vehicle needs THIS machine's address on the team subnet. The boat finds it
# from the [discovery] beacon below (ocs_host: "auto"), so nobody types it; a
# vehicle client with a fixed address (Ekko's today) still needs this machine to
# keep one -- a static address on the team NIC or a DHCP reservation on the team
# router. (The handbook's ban on static addressing applies only to the
# RoboCommand-facing interface, not to our own team network.)
#
# 37564 is clear of the Jetson's own ports: 8090 ground_station, 8080/8081 the
# viewers it embeds.
host = "0.0.0.0"
port = 37564
enabled = true

[discovery]
# A UDP beacon that tells the vehicles where [tcp] is, so the boat's ocs_host can
# be "auto" instead of this laptop's address (which has been 192.168.100.107,
# 192.168.8.107 and 192.168.1.75). What it sends, where it never sends and what
# the boat does with it: rx_bridge/beacon.py and docs/VEHICLE_LINK.md "Discovery".
#
# Off unless enabled = true: a config without this section must not start
# broadcasting. Sent from every local address except loopback, link-local,
# anything inside never_on, and anything in the same /24 as RoboCommand's broker
# or the very address that reaches it -- the course network is never spoken on.
# With [robocommand] host = "auto" an address is also held back until the search
# has swept its /24, or has found RoboCommand.
enabled = true
port = 37565              # UDP; paired with [tcp] port. Both sides must agree.
interval_s = 1.0          # at most 2.0: the boat forgets a beacon after 5 s
# Setting never_on REPLACES this default; keep all four course subnets in it.
never_on = ["192.168.65.0/24", "192.168.66.0/24",
            "192.168.67.0/24", "192.168.68.0/24"]   # Alpha, Bravo, Charlie, Delta

[robocommand]
# "auto": find the broker by the course it keeps retained on
# robocommand/robotx/course -- each interface's default gateway first (handbook
# 3.4.3: the gateway is the course's RoboCommand), then .2 and .3 of each local
# /24, then a sweep of each /24 for TCP 1883 (rx_bridge/rcfind.py). The page
# lists every host that answered and what it said. An address here pins the
# broker and skips the search: 192.168.69.3 at the Singapore screening
# (7 Nov 2026), 192.168.65.2-192.168.68.2 for courses Alpha-Delta.
host = "auto"
port = 1883

[tiers]
# What we are declaring. TIER_NONE for anything not attempted this run --
# TIER_UNKNOWN is the proto3 zero value and is never legal to send.
task1 = "TIER_CORE"
task2 = "TIER_NONE"
task3 = "TIER_NONE"
task4 = "TIER_NONE"

[limits]
# Ekko alone at screening and validation, 7-8 Nov 2026. Delete this
# line for any run with Crusader, or for a Proof of Readiness log (handbook 3.1).
min_declared = 1
rate = 5.0                # messages/second, metered per vehicle -- the
                          # handbook says "per system", which settles the
                          # question the USV repo left open
heartbeat_reserve = 2.0   # tokens only heartbeats may spend
stale_ms = 1000.0         # default; per-vehicle overrides above win
link_prefer_s = 3.0       # a vehicle on two links (see `prefer` above): a report
                          # is dropped while the other link delivered the same
                          # kind within this long and outranks it (real over
                          # synthesized, then `prefer`), and a link silent
                          # longer than this stops being "fresh" when the OCS
                          # picks where to send

[paths]
seq_store = "run/seq.json"
wire_log  = "run/wire"

[uav]
# pilot_callsign: the team-wide default for the call-sign box next to Declare. It
# goes out as RunDeclaration.uav_pilot_callsign whenever an aircraft is declared:
# the pilot's MyDroneFleets call sign for THIS run, first name + UAPL number. Typed
# on the page; "Save as default" there keeps it on THIS laptop (run/operator.json,
# never committed), which wins over this line. Blank everywhere: Declare stays off
# until someone types it.
pilot_callsign = ""

[geofence]
# THE UAV GEOFENCE (Chase, 7 Nov 2026). When RoboCommand's RxCourse arrives the OCS
# makes RoboCommand's polygon from it -- the course boundary, joined with
# RxCourse.uav_transit_area when the two share an edge, shrunk inward by
# boundary_margin_m -- and fleet_link puts that on Ekko's autopilot, once, so QGC
# shows it (Plan view, Download). The pilot draws Ekko's OWN fence inside it in QGC
# and uploads. A declaration carries what the pilot drew, read back off the
# autopilot over the radio, and the ceiling Ekko itself enforces: home altitude
# (HAE) + FENCE_ALT_MAX. Nothing in this file is declared: set FENCE_ALT_MAX in QGC.
#
# Before every declaration with an aircraft the OCS applies RoboCommand's own check
# (their test server's geofence_problems): at least 4 points, closed, every point
# along every edge within the course or transit area to 1 m, and a ceiling above 0
# and at most ceiling_limit_hae_m. RoboCommand REFUSES SILENTLY -- no reply, the run
# just never starts -- so the OCS refuses first, in words, on the page.
#
# [[geofence.course]] entries and max_altitude_hae_m went with that change, and the
# bridge refuses to start with either, so nobody declares a fence written here
# believing it is used. Chris's SV1 and SV3 fences of 7 Nov 2026 were drawn in QGC
# (Desktop\test.plan and Desktop\sv3plan.plan); their vertices are in git, bridge.toml
# at commit 2cbe11b.

ceiling_limit_hae_m = 50.0  # The most RoboCommand accepts: their test server's
                          # MAX_UAV_ALTITUDE_HAE_M. Handbook 5.3.3 says 60 m AMSL.

boundary_margin_m = 2.0   # How far inside the course RoboCommand's polygon sits, so a
                          # fence drawn along it is strictly inside the boundary, never
                          # on it, where a float-rounding validation could reject it.
                          # Chase's to change.

confirm_max_age_s = 180   # A UAV is not declared unless its autopilot's fence was read
                          # within this many seconds (fleet_link reads it every 30 s
                          # while Ekko is disarmed and heard on the radio).
