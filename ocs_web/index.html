<script>
/* Applied BEFORE the body paints, so day mode never flashes the night palette.
   Same key and same rule as map.html (same origin, so the choice is shared).
   try/catch: a browser set to block site data throws on the accessor. */
try { if (localStorage.getItem('ocs-theme') === 'day')
        document.documentElement.setAttribute('data-theme', 'day'); } catch (e) {}
</script>
<style>
  /* TWO THEMES, EVERY COLOUR A VARIABLE. Night is the original palette, unchanged.
     Day is a sunlight theme (near-black on near-white, darkened status colours)
     for a laptop in direct equatorial sun; its values match map.html's. */
  :root { color-scheme: dark;
    --bg:#11141a; --fg:#dfe4ec; --h1:#8fa3bf; --h2:#7d8ba0;
    --card:#171b23; --card-line:#232936; --muted:#6d7a8d; --pre:#9fb0c7;
    --ok-bg:#173a24;   --ok-fg:#5fd18a;   --bad-bg:#3d1a1e;  --bad-fg:#ff8b93;
    --warn-bg:#3b3117; --warn-fg:#e8b757; --idle-bg:#232936;  --idle-fg:#8b99ae;
    --btn-bg:#232b38; --btn-line:#33405a; --btn-hi:#2c374a;
    --go-bg:#183a26;   --go-line:#2f6b45;   --go-fg:#7fe0a4;
    --stop-bg:#3a1a1e; --stop-line:#6b2f35; --stop-fg:#ff9aa2;
    --banner-bg:#4a2410; --banner-line:#8a4a1a; --banner-fg:#ffb877;
    --link:#7fb4ff; --logo-bg:#ffffff; }
  html[data-theme="day"] { color-scheme: light;
    --bg:#ffffff; --fg:#0b0e12; --h1:#14496e; --h2:#3f4a55;
    --card:#eef1f4; --card-line:#8d99a6; --muted:#5a6672; --pre:#1f2a35;
    --ok-bg:#cfeedb;   --ok-fg:#0a6b2e;   --bad-bg:#f8d7d9;  --bad-fg:#a50f16;
    --warn-bg:#fae3bd; --warn-fg:#7a4200; --idle-bg:#d9dfe5;  --idle-fg:#2b343d;
    --btn-bg:#dde3e9; --btn-line:#8d99a6; --btn-hi:#ccd5dd;
    --go-bg:#cfeedb;   --go-line:#0a6b2e;   --go-fg:#0a6b2e;
    --stop-bg:#f8d7d9; --stop-line:#a50f16; --stop-fg:#8c1015;
    --banner-bg:#ffd9b8; --banner-line:#a34a00; --banner-fg:#5c2600;
    --link:#0b4f9a; --logo-bg:#ffffff; }
  body { background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         margin:0; padding:14px 18px; }
  .top { display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; margin:0 0 10px }
  /* The team's logos (dark line art): a white badge in BOTH themes, as on the boat and drone GUIs. */
  .logos { display:flex; align-items:center; gap:6px; flex:none; background:var(--logo-bg);
           border:1px solid var(--card-line); border-radius:6px; padding:2px 6px }
  .logos img { height:26px; width:auto; display:block }
  h1 { font-size:15px; margin:0; letter-spacing:.08em; text-transform:uppercase; color:var(--h1) }
  .nav a { color:var(--link); text-decoration:none } .nav b { color:var(--fg) }
  h2 { font-size:12px; margin:18px 0 6px; letter-spacing:.08em; text-transform:uppercase; color:var(--h2) }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start }
  .card { background:var(--card); border:1px solid var(--card-line); border-radius:6px; padding:10px 12px; }
  .grow { flex:1; min-width:320px }
  table { border-collapse:collapse; width:100% }
  td,th { text-align:left; padding:3px 10px 3px 0; vertical-align:top; white-space:nowrap }
  th { color:var(--h2); font-weight:normal }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px }
  .ok   { background:var(--ok-bg); color:var(--ok-fg) }
  .bad  { background:var(--bad-bg); color:var(--bad-fg) }
  .warn { background:var(--warn-bg); color:var(--warn-fg) }
  .idle { background:var(--idle-bg); color:var(--idle-fg) }
  button { background:var(--btn-bg); color:var(--fg); border:1px solid var(--btn-line); border-radius:4px;
           padding:4px 10px; font:inherit; cursor:pointer }
  button:hover { background:var(--btn-hi) }
  button.go { border-color:var(--go-line); background:var(--go-bg); color:var(--go-fg) }
  button.stop { border-color:var(--stop-line); background:var(--stop-bg); color:var(--stop-fg) }
  #banner, #benchbanner { background:var(--banner-bg); border:1px solid var(--banner-line); color:var(--banner-fg);
            padding:6px 12px; border-radius:5px; margin-bottom:12px; display:none }
  pre { margin:0; max-height:150px; overflow:auto; color:var(--pre); font-size:12px }

  details summary { cursor:pointer; color:var(--h2) }
  details pre { max-height:260px; margin-top:6px }
</style>

<div id="banner">⚠ FAKE DATA INJECTION IS ENABLED — this OCS can publish heartbeats no vehicle sent.</div>

<div class="top">

<div class="row">
  <div class="card">
    <table>
      <tr><th>RoboCommand</th><td id="link-rc">—</td></tr>
      <tr><th>Team broker</th><td id="link-team">—</td></tr>
      <tr><th title="UDP broadcast that tells the vehicles where this OCS is">Beacon</th>
          <td id="link-beacon" style="white-space:normal; max-width:46ch">—</td></tr>
      <tr><th>Run</th><td id="run">—</td></tr>
      <tr><th>Course</th><td id="course">—</td></tr>
      <tr><th title="the UAV geofence for this course, and whether each aircraft's autopilot was read back holding it">UAV fence</th>
          <td id="uavfence" style="white-space:normal; max-width:46ch">—</td></tr>

    <div style="margin-top:10px; display:flex; gap:8px">

      <button class="stop" onclick="post('/api/end')">End run</button>
    </div>
    <div id="activecount" class="muted" style="margin-top:6px"></div>
    <div id="declblock" style="margin-top:6px; white-space:normal; max-width:46ch"></div>
    <div id="action" class="muted" style="margin-top:6px"></div>
  </div>

  <div class="card grow">
    <table>
      <tr><th>forwarded</th><th>rate</th><th>invalid</th><th>mistyped</th>
          <th title="a copy another link had already delivered">not pref.</th>
          <th>stale</th><th>cmds</th><th>undeliv.</th></tr>
      <tr id="counters"><td colspan="8" class="muted">—</td></tr>
    </table>
  </div>
</div>

<h2>Fleet</h2>
<div id="fleet" class="row"></div>

<h2>Commands from RoboCommand</h2>
<div class="card"><table id="cmds"><tr><td class="muted">nothing yet</td></tr></table></div>

<h2>Log</h2>
<div class="card"><pre id="log"></pre></div>

<script>
const $ = id => document.getElementById(id);

function pill(cls, text) { return `<span class="pill ${cls}">${text}</span>`; }

// Which vehicles go into the RunDeclaration. This is not cosmetic:
// RoboCommand holds RunStart until EVERY declared vehicle reports
// STATE_AUTO, with no timeout, so declaring a vehicle that is not on the
// water means the run simply never starts.
//
// The box shows the EFFECTIVE state; clicking forces the opposite. A
// forced vehicle is marked, with a click to hand it back to the
// telemetry -- otherwise an override set an hour ago is invisible.
function activeBox(v) {
  const forced = v.active_forced;
  const mark = forced === null || forced === undefined ? ''
    : ` <a href="#" onclick="setActive('${v.id}',null);return false" `
      + `class="muted" title="back to deciding from telemetry">forced</a>`;
  return `<input type="checkbox" ${v.active ? 'checked' : ''} `
       + `onclick="setActive('${v.id}', this.checked)" `
       + `title="include ${v.id} in the RunDeclaration">${mark}`;
}

function setActive(id, on) {
  fetch('/api/active', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({vehicle:id, on:on})})
    .then(r=>r.json()).then(j=>{ $('action').textContent = j.result; refresh(); });
}

// What we are actually publishing to RoboCommand for this vehicle. The
// handbook obliges 2 Hz per active vehicle; this is the measurement, so a
// forward loop that has quietly fallen behind is visible rather than assumed.
// Only meaningful once reports are flowing -- before declaring we publish
// nothing on purpose, and 0.00 Hz there is correct, not a fault.
function rateCell(v) {
  const hz = v.published_hz || 0;
  if (hz === 0) return `<span class="muted">nothing published</span>`;
  const cls = hz >= 1.8 ? 'ok' : (hz >= 1.0 ? 'warn' : 'bad');
  return `${pill(cls, hz.toFixed(2) + ' Hz')} <span class="muted">need 2.00</span>`;
}

async function post(url, body) {
  const r = await fetch(url, {method:'POST', body: JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({result:'(no response)'}));
  $('action').textContent = j.result || '';
  refresh();
}

function inject(vid, mode, on, fault) {
  post('/api/inject', {vehicle: vid, mode: mode, on: on, fault: fault || ''});
}

// A vehicle's hello can name its agent, and that string reaches innerHTML below.
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));

// One link, three facts that must not be mistaken for one another: the socket
// is up, something has been RELAYED on it (a hello is not a report), and that
// was recent. An adapter -- the laptop-side radio bridge -- is up whether or not
// the vehicle behind it is alive, so its socket alone proves nothing about the
// vehicle: until it has relayed a report the line says so, in grey, like
// "never heard".
function linkState(l) {
  const age = l.last_report_age_s;
  if (age === null || age === undefined)
    return l.adapter ? pill('idle', 'adapter up, vehicle silent')
                     : pill('idle', 'connected, nothing reported');
  const secs = age.toFixed(1) + ' s';
  if (l.fresh) return pill('ok', 'fresh ' + secs);
  return pill('warn', (l.adapter ? 'adapter up, vehicle silent ' : 'silent ') + secs);
}

// radio / wifi, in the snapshot's order. "active" is where a command would go
// right now; "preferred" is the bridge.toml choice. Each can be a link that is
// not connected, which is exactly when the difference matters.
function linkLine(v, name) {
  const l = (v.links || {})[name];
  const tags = [];
  if (v.prefer === name) tags.push(pill('idle', 'preferred'));
  if (l && v.active_link === name) tags.push(pill('ok', 'active'));
  if (!l) return `<div><b>${name}</b> <span class="muted">not connected</span> ${tags.join(' ')}</div>`;
  // An adapter's own address is the laptop's loopback; the label names what it is.
  const who = l.adapter ? `<b>${esc(l.label)}</b>`
                        : `<b>${name}</b> <span class="muted">${esc(l.peer)}</span>`;
  const synth = (l.synthesized || []).length
    ? ` <span class="muted">synthesizes ${l.synthesized.map(esc).join(', ')}</span>` : '';
  return `<div>${who} ${linkState(l)} ${tags.join(' ')}${synth}</div>`;
}

function linksCell(v) {
  const names = Object.keys(v.links || {});
  const lines = names.map(n => linkLine(v, n)).join('');
  const connected = names.some(n => v.links[n]);
  // No socket at all: say how it last reported, if it ever did (mqtt in a bench).
  return lines + (!connected && v.link ? `<div class="muted">last report via ${esc(v.link)}</div>` : '');
}

// Reports dropped because another link had just delivered the same kind and
// outranked this one (real over synthesized, then the preferred link).
function dropsCell(v) {
  const n = v.dropped_not_preferred || 0;
  if (!n) return '<span class="muted">0</span>';
  const kinds = Object.entries(v.dropped_not_preferred_by_kind || {})
    .map(([k, c]) => `${esc(k)} ${c}`).join(', ');
  return `${n} <span class="muted">${kinds}</span>`;
}

function vehicleCard(v, streaming, injectOn) {
  const hb = (v.report && v.report.heartbeat) || {};
  const silent = v.silent_s;
  let health = pill('idle','never heard');
  if (silent !== null && silent !== undefined) {
    const budget = Math.max(1.5, v.stale_ms/1000);
    health = silent > budget ? pill('bad', silent.toFixed(1)+'s silent')
                             : pill('ok', silent.toFixed(1)+'s ago');
  }
  const pos = hb.position ? `${(hb.position.latitude||0).toFixed(5)}, ${(hb.position.longitude||0).toFixed(5)}` : '—';
  const streamOn = streaming.includes(v.id);

  const buttons = injectOn ? `
    <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap">
      <button onclick="inject('${v.id}','once')">Inject 1</button>
      <button class="${streamOn?'stop':'go'}" onclick="inject('${v.id}','stream',${!streamOn})">
        ${streamOn ? 'Stop 2 Hz' : 'Stream 2 Hz'}</button>
    </div>
    <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap">
      <button onclick="inject('${v.id}','once','nan')">NaN hdg</button>
      <button onclick="inject('${v.id}','once','unknown_task')">no task</button>
      <button onclick="inject('${v.id}','once','mistype')">wrong type</button>
      ${v.type==='TYPE_UAV' ? `<button onclick="inject('${v.id}','once','no_phase')">no phase</button>`:''}
    </div>` : '';

  return `<div class="card grow">
    <div>${activeBox(v)} <b>${v.id}</b> <span class="muted">${v.type.replace('TYPE_','')}</span>
         ${v.relay_via ? `<span class="muted">via ${v.relay_via}</span>`:''} ${health}</div>
    <table style="margin-top:6px">
      <tr><th>links</th><td style="white-space:normal">${linksCell(v)}</td></tr>
      ${v.prefer || v.dropped_not_preferred
        ? `<tr><th title="a copy another link had already delivered">not pref.</th><td>${dropsCell(v)}</td></tr>` : ''}
      <tr><th>published</th><td>${rateCell(v)}</td></tr>
      <tr><th>state</th><td>${hb.state || '—'}</td></tr>
      <tr><th>task</th><td>${hb.current_task || '—'}</td></tr>
      <tr><th>position</th><td>${pos}</td></tr>
      <tr><th>hdg / spd</th><td>${fmt(hb.heading_deg)}° / ${fmt(hb.spd_mps)} m/s</td></tr>
      ${v.type==='TYPE_UUV' ? `<tr><th>depth</th><td>${fmt(hb.depth_m)} m</td></tr>`
                            : `<tr><th>alt (HAE)</th><td>${fmt(hb.altitude_hae_m)} m</td></tr>`}
      ${v.type==='TYPE_UAV' ? `<tr><th>phase</th><td>${hb.flight_phase||'—'}</td></tr>`:''}
      <tr><th>seq</th><td>${(v.report && v.report.seq) || '—'}</td></tr>
    </table>
    <details style="margin-top:6px"><summary>all fields</summary>
      <pre>${JSON.stringify(v.report||{}, null, 1)}</pre></details>
    ${buttons}
  </div>`;
}

function fmt(x) { return (x === undefined || x === null) ? '—' : Number(x).toFixed(1); }

// The discovery beacon: which of this laptop's addresses the vehicles are being
// told about. The skipped list matters as much as the sending one -- the course
// network showing up there with its reason is the proof it is not being spoken on.
function beaconCell(b) {
  if (!b || !b.enabled)
    return pill('idle', 'off') + ` <span class="muted">${esc((b && b.why) || '')}</span>`;
  const on = b.sending_on || [];
  let out = on.length
    ? pill('ok', 'broadcasting') + ` <span class="muted">UDP ${b.port} from ${on.map(esc).join(', ')}</span>`
    : pill('warn', 'no address') + ' <span class="muted">nothing eligible to broadcast from</span>';
  if (b.errors)
    out += ` ${pill('bad', b.errors + ' error' + (b.errors > 1 ? 's' : ''))} `
         + `<span class="muted">${esc(b.last_error || '')}</span>`;
  const skipped = (b.skipped || []).map(x => `${esc(x.addr)} (${esc(x.why)})`);
  if (skipped.length) out += `<div class="muted">not from: ${skipped.join('; ')}</div>`;
  return out;
}

// One aircraft's confirmation (`ocs_fence`, as the radio adapter sent it) against the fence
// this OCS holds for the course. The gate that decides whether Ekko can be declared is in the
// bridge (the reason is shown under the buttons); this line is the evidence it is judging.
// "cleared" is a verified EMPTY polygon: the autopilot's fence was removed and read back
// empty, which is what the adapter does when this OCS has no course at all.
function confirmLine(v, c, maxAge) {
  const name = `<b>${esc(v.id)}</b> `;
  if (!c) return name + pill('idle', 'no confirmation yet');
  const age = (c.age_s === null || c.age_s === undefined) ? null : c.age_s;
  let tag;
  if (!c.verified) tag = pill('warn', 'not verified');
  else if (Array.isArray(c.polygon) && c.polygon.length === 0) tag = pill('idle', 'cleared');
  else if (!c.matches_course_fence) tag = pill('warn', 'holds another polygon');
  else if (age === null || age > maxAge) tag = pill('bad', 'stale');
  else tag = pill('ok', 'confirmed');
  const n = Array.isArray(c.polygon) && c.polygon.length ? `, ${c.polygon.length} vertices` : '';
  return name + tag + ` <span class="muted">${esc(c.state || '—')}${n}, `
    + (age === null ? 'age unknown' : Math.round(age) + ' s ago') + `</span>`
    + (c.lockout ? ` ${pill('warn', 'will not arm here')}<div class="muted">${esc(c.lockout)}</div>` : '')
    + (!c.verified && c.reason ? `<div class="muted">${esc(c.reason)}</div>` : '');
}

// The UAV geofence for the CURRENT course: where it came from and how many vertices -- or, when
// there is none, why. With a course held and no fence the badge is red: the aircraft keeps whatever
// fence it already has, so that case must not read as quiet.
function fenceCell(s) {
  const f = s.uav_geofence;
  const held = !!(s.course && s.course.course_id);
  let out = (f && f.length)
    ? `<b>${esc(s.uav_geofence_source || '?')}</b> <span class="muted">${f.length - 1} vertices</span>`
    : pill(held ? 'bad' : 'idle', 'none') + ` <span class="muted">${esc(s.uav_geofence_reason || '')}</span>`;
  const max = s.fence_confirm_max_age_s || 180;
  (s.vehicles || []).filter(v => v.type === 'TYPE_UAV').forEach(v => {
    out += `<div>${confirmLine(v, (s.fence_confirm || {})[v.id], max)}</div>`;
  });
  return out;
}

async function refresh() {
  let s;
  try { s = await (await fetch('/api/state')).json(); }
  catch (e) { $('link-rc').innerHTML = pill('bad','OCS unreachable'); return; }

  $('team').textContent = s.team_id;
  const ep = s.endpoints || {};
  $('link-rc').innerHTML   = (s.links.robocommand ? pill('ok','connected') : pill('bad','DOWN'))
    + ` <span class="muted">${ep.robocommand||''}</span>`;
  $('link-team').innerHTML = (s.links.team ? pill('ok','connected') : pill('bad','DOWN'))
    + ` <span class="muted">${ep.team||''}</span>`;
  $('link-beacon').innerHTML = beaconCell(s.beacon);

  const r = s.run;
  $('run').innerHTML = pill(r.state==='RUNNING'?'ok':(r.state==='DECLARED'?'warn':'idle'), r.state)
    + (r.declaration_seq!=null ? ` <span class="muted">decl_seq=${r.declaration_seq}</span>`:'')
    + (r.run_id!=null ? ` <span class="muted">run_id=${r.run_id}</span>`:'');

  const cf = s.course_findings || [];
  $('course').innerHTML = (s.course && s.course.course_id
      ? `${s.course.course_id} <span class="muted">pinger ${s.course.pinger_freq_hz||'?'} Hz, `
        + `${(s.course.corners||[]).length} corners</span>`
      : pill('idle','not received'))
    // Advisory, never blocking -- their frame is authoritative even when it
    // is odd. But the operator must not declare against a course we misread.
    + (cf.length ? ` ${pill('bad','suspect')}<div class="muted" style="margin-top:4px">`
                   + cf.map(x=>`&bull; ${esc(x)}`).join('<br>') + '</div>' : '');
  $('uavfence').innerHTML = fenceCell(s);

  // RoboCommand holds RunStart until EVERY declared vehicle reports
  // STATE_AUTO -- with no timeout and no error, so naming the laggard is the
  // difference between a diagnosis and a silent wait.
  // Below the handbook's floor the declaration cannot be made at all, so
  // say why on the button rather than letting it fail on click.
  const act = s.active || [], need = s.por_min_vehicles || 2;
  // The bridge decides (run.may_declare is its whole verdict: state, the floor, and the UAV
  // fence gate) and says why in words (run.declare_blocker). The endpoint refuses on its own,
  // so this is the operator's explanation, not the safeguard.
  const blocked = s.run.declare_blocker;
  const decl = document.querySelector('button.go');
  if (decl) {
    const ok = act.length >= need && (s.run.may_declare !== false);
    decl.disabled = !ok;
    decl.title = blocked ? blocked
      : act.length < need ? `need at least ${need} active vehicles, have ${act.length}`
      : `declare ${act.join(', ')}`;
  }
  $('activecount').innerHTML = act.length
    ? `${act.length} active: <b>${act.join(', ')}</b>`
      + (act.length < need ? ` ${pill('bad','need '+need)}` : '')
    : pill('bad','no active vehicles');
  // The floor has its own pill above and the run state its own line; what is left is the
  // reason that would otherwise be a disabled button with no explanation.
  $('declblock').innerHTML = (blocked && act.length >= need && r.state !== 'DECLARED' && r.state !== 'RUNNING')
    ? `${pill('bad','cannot declare')} <span class="muted">${esc(blocked.replace(/^cannot declare( -- )?/, ''))}</span>`
    : '';

  const wait = s.awaiting_auto || [];
  if (r.state === 'DECLARED') {
    $('run').innerHTML += wait.length
      ? ` <span class="muted">waiting on ${wait.join(', ')} to reach AUTO</span>`
      : ` ${pill('ok','all AUTO')} <span class="muted">RunStart is theirs to send</span>`;
  }

  const c = s.counters;
  $('counters').innerHTML = `<td>${c.forwarded}</td><td>${c.dropped_rate}</td>
    <td>${c.dropped_invalid}</td><td>${c.dropped_mistyped}</td>
    <td>${c.dropped_not_preferred || 0}</td><td>${c.stale}</td>
    <td>${c.commands_routed}</td><td>${c.commands_undeliverable}</td>`;

  $('banner').style.display = s.inject.enabled ? 'block' : 'none';
  // Bench dry run (--bench-auto): the OCS is telling RoboCommand a state the
  // vehicles are not in. textContent, not innerHTML: ids come from the config.
  const ba = s.bench_auto || {vehicles: [], substituted: {}};
  $('benchbanner').style.display = ba.vehicles.length ? 'block' : 'none';
  $('benchbanner').textContent = ba.vehicles.length
    ? '⚠ BENCH AUTO IS ON — STATE_AUTO is published for ' + ba.vehicles.join(', ')
      + ' while they report MANUAL (substituted: '
      + ba.vehicles.map(v => v + ' ' + (ba.substituted[v] || 0)).join(', ')
      + '). RoboCommand sees a state the vehicles are not in. Never at competition.'
    : '';
  $('fleet').innerHTML = s.vehicles
    .map(v => vehicleCard(v, s.inject.streaming, s.inject.enabled)).join('');

  $('cmds').innerHTML = s.commands.length ? s.commands.map(k => `<tr>
      <td>${new Date(k.at*1000).toLocaleTimeString()}</td>
      <td><b>${k.which}</b></td><td>seq=${k.seq}</td>
      <td>${k.delivered ? pill('ok','→ '+(k.targets.join(', ')||'—'))
                        : pill('bad','undeliverable: '+(k.detail||''))}</td>
    </tr>`).join('') : '<tr><td class="muted">nothing yet</td></tr>';

  $('log').textContent = (s.log||[]).join('\n');
  $('log').scrollTop = $('log').scrollHeight;
}

// Day/night. Same key and logic as map.html (same origin: one choice for both
// pages); the pre-paint script in <head> has already applied a saved 'day'.
const themeNow = () =>
  document.documentElement.getAttribute('data-theme') === 'day' ? 'day' : 'night';
function paintThemeButton(mode) {      // the button names the mode it switches TO
  $('theme').textContent = mode === 'day' ? '☾ night' : '☀ day';
  $('theme').title = mode === 'day' ? 'back to the low-light palette'
                                    : 'high-contrast palette for direct sun';
}
$('theme').onclick = () => {
  const mode = themeNow() === 'day' ? 'night' : 'day';
  document.documentElement.setAttribute('data-theme', mode);
  try { localStorage.setItem('ocs-theme', mode); } catch (e) {}
  paintThemeButton(mode);
};
paintThemeButton(themeNow());

refresh();
setInterval(refresh, 500);
</script>
