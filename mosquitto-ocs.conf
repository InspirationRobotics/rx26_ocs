# mosquitto-ocs.conf -- the TEAM broker, run on the OCS laptop for Gate G3 Part B.
#
# Bound to loopback and to the OCS's own TEAM-network address ONLY, never to
# 0.0.0.0. A broker on 0.0.0.0 also listens on the RoboCommand-facing NIC, which
# is exposing another network's service on that interface -- the thing the
# handbook forbids the OCS from doing. Binding explicitly makes that impossible
# rather than dependent on a firewall rule being right.
#
#   & 'C:\Program Files\mosquitto\mosquitto.exe' -c mosquitto-ocs.conf -v
#
# The Windows mosquitto SERVICE must be stopped first -- it holds 127.0.0.1:1883
# and two brokers on one desk is how you spend an hour debugging a bridge that
# is talking to the wrong one.
#
# EDIT THE SECOND LISTENER when the Wi-Fi lease changes: mosquitto refuses to
# start if it cannot bind the address, which is the loud failure we want.

allow_anonymous true
persistence false
log_type all

listener 1883 127.0.0.1
listener 1883 192.168.8.241
